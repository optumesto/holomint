<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="3;url=/">
<title>Holomint: page not found</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#070916;--ink:#ece7d8;--ink3:#5d6480;
    --holo:linear-gradient(110deg,#c8a2ff,#7fb0ff,#7df0c8,#ffe08a,#ff9ad2,#c8a2ff)}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .bar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--holo);background-size:240% auto}
  h1{font-size:34px;font-weight:600;margin-bottom:10px;color:#c8a2ff;
    background:var(--holo);background-size:240% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p{color:var(--ink3);font-size:14px;line-height:1.6}
  a{color:var(--ink);text-decoration:underline}
</style>
</head>
<body>
<div class="bar"></div>
<div>
  <h1>Holomint</h1>
  <p>That page does not exist. Taking you to the app,<br>or <a href="/">tap here</a> to go now.</p>
</div>
</body>
</html>

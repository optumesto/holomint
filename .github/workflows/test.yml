name: Loader tests
on:
  pull_request:
  push:
    # Code paths only. The daily price job commits the big JSON files twice a
    # day, and re-running a browser suite on an 83MB checkout for a data-only
    # change is minutes spent to learn nothing. Data drift is covered by the
    # weekly run below instead.
    paths:
      - 'index.html'
      - 'sw.js'
      - 'test_loader.py'
      - 'test_install_offer.py'
      - 'test_ui_shell.py'
      - 'test_money_path.py'
      - 'test_cardfind.py'
      - 'lotfixtures.py'
      - 'cardfind.js'
      - 'test_tap_targets.py'
      - 'shots.py'            # test_tap_targets imports its tour dismissal
      - 'requirements-dev.txt'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '0 6 * * 1'     # Mondays 06:00 UTC — catches a shape change in history.json
  workflow_dispatch:        # manual run button in the Actions tab
permissions:
  contents: read
jobs:
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # the suite is ~1 min; anything near this is a hang
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        # cache-dependency-path is required: setup-python's pip cache looks for
        # **/requirements.txt by default and hard-errors when it finds none.
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # --with-deps pulls the system libs headless chromium needs on a bare runner.
      - run: python3 -m playwright install --with-deps chromium
      # Separate steps, not one script: a failure names which suite broke in the
      # job list without anyone opening the log.
      - run: python3 test_loader.py
      - run: python3 test_install_offer.py
      - run: python3 test_ui_shell.py
      - run: python3 test_tap_targets.py
      - run: python3 test_money_path.py
      - run: python3 test_cardfind.py

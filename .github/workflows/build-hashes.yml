name: Build card hashes

# Generates hashes.json (the scanner's perceptual-hash database) in the cloud and
# commits it back to the repo, so the live app serves it to every user — no local
# Python, no manual step.
#
# Runs daily, ~90 min after prices.yml refreshes products.json, so brand-new cards
# become image-scannable within a day of hitting the catalog. The build is
# incremental: it skips every card already hashed and only downloads new ones, so
# day-to-day runs finish in a couple of minutes. The first run (full ~57k) takes ~1h.
#
# SETUP (one time):
#   1. make_hashes.py in the repo root.
#   2. This file at  .github/workflows/build-hashes.yml
#   3. GitHub -> Actions -> "Build card hashes" -> Run workflow (for the initial build).
# Resumable: if a run is throttled and finishes partial, just run it again to fill gaps.

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    - cron: '0 1 * * *'         # daily 01:00 UTC — after prices.yml's 23:30 catalog refresh

permissions:
  contents: write               # lets the Action commit hashes.json back

concurrency:
  group: build-hashes           # never let two hash builds run at once
  cancel-in-progress: false     # let an in-flight build finish; queue the next

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # well under GitHub's 6h cap; full build is ~1h
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Build hashes.json
        run: python make_hashes.py

      - name: Commit hashes.json if changed
        run: |
          if [ -z "$(git status --porcelain hashes.json)" ]; then
            echo "hashes.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hashes.json
          git commit -m "Update card hash database [skip ci]"
          git pull --rebase
          git push
